name: Browser Worker CI
on:
  pull_request:
    paths:
      - "services/browser/**"
      - "poc/smoke1/browserbase.mjs"
      - "poc/smoke1/mock-browserbase.mjs"
      - "apps/web/public/browser-lab/**"
      - ".github/workflows/browser-worker.yml"
  push:
    paths:
      - "services/browser/**"
      - "poc/smoke1/browserbase.mjs"
      - "poc/smoke1/mock-browserbase.mjs"
      - "apps/web/public/browser-lab/**"
      - ".github/workflows/browser-worker.yml"
jobs:
  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: services/browser
      # real Chromium for the end-to-end test (redirect/SSRF guard, cancel); REQUIRE_BROWSER makes a missing browser a failure
      - run: npx playwright-core install --with-deps chromium
        working-directory: services/browser
      - run: npm test
        working-directory: services/browser
        env:
          REQUIRE_BROWSER: "1"
      - run: docker build -f services/browser/Dockerfile .
