name: Browser Worker CI
on:
  pull_request:
    paths:
      - "services/browser/**"
      - "poc/smoke1/browserbase.mjs"
      - ".github/workflows/browser-worker.yml"
  push:
    paths:
      - "services/browser/**"
      - "poc/smoke1/browserbase.mjs"
      - ".github/workflows/browser-worker.yml"
jobs:
  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: services/browser
      - run: node --check server.mjs && node --test server.test.mjs
        working-directory: services/browser
      - run: docker build -f services/browser/Dockerfile .
