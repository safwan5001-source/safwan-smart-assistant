[project]
name = "safwan-assistant-api"
version = "0.1.0"
description = "Personal assistant orchestration API foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["schema*", "tests*"]
